name: Copier la branche s938b

on:
  push:
    branches: [copy-s938b-tmp]

permissions:
  contents: write
  workflows: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy-s938b-tmp
      - name: Copier s938b depuis le fork source
        run: |
          git remote add src https://github.com/2253845067/DFRoot.git
          git fetch src s938b
          git push --force origin FETCH_HEAD:refs/heads/s938b
      - name: Supprimer la branche temporaire
        run: git push origin --delete copy-s938b-tmp
