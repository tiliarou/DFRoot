name: Copier la branche s938b

on:
  push:
    branches: [copy-s938b-tmp]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Copier s938b depuis le fork source
        run: |
          git clone --single-branch --branch s938b https://github.com/2253845067/DFRoot.git src
          cd src
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/tiliarou/DFRoot.git" HEAD:refs/heads/s938b
      - name: Supprimer la branche temporaire
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/tiliarou/DFRoot.git" --delete refs/heads/copy-s938b-tmp
